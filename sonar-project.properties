# SonarQube analizi. Nasıl çalıştırılır: docs/sonar.md
sonar.projectKey=derslik
sonar.projectName=Derslik
sonar.sourceEncoding=UTF-8

# Gerçek testlerin V8 kapsamı c8 ile kaynak TypeScript satırlarına eşlenir.
sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info

# Kapı bütün açık sorunlara bakar; "yeni kod" için git blame gerekmez.
# Ayrıca worktree'lerde .git bir dosyadır ve ana depoyu gösterir; Docker
# tarayıcısına bağlanmadığı için tarama "Unable to open Git repository" ile
# düşüyordu. Sonar kaynaklarında git'in yok saydığı dosya yok (2026-10-02).
sonar.scm.disabled=true

sonar.sources=apps/api/src,apps/api/drizzle.config.ts,apps/web/app,apps/web/components,apps/web/hooks,apps/web/lib,apps/web/proxy.ts,apps/web/next.config.ts,apps/web/postcss.config.mjs,apps/mobile/src,apps/mobile/index.ts,apps/mobile/metro.config.cjs,packages/contracts/src,packages/api-client/src,scripts,build,next.config.ts,vite.config.ts,drizzle.config.ts,eslint.config.mjs,postcss.config.mjs
sonar.tests=apps/api/tests,tests

# Derleme çıktısı, mobil native proje ve eski v4 migration'ları analiz dışı.
# apps/web/components/ui: shadcn'in olduğu gibi kopyalanan bileşenleri (bilerek değiştirilmiyor).
sonar.exclusions=**/node_modules/**,**/.next/**,**/.api-build/**,**/dist/**,apps/mobile/android/**,apps/web/components/ui/**,apps/web/vendor/**,drizzle/**,apps/api/drizzle/**

# Çeviri dosyaları aynı anahtar yapısını paylaşır; tekrar sayımına girmesin.
sonar.cpd.exclusions=packages/contracts/src/i18n/**

# Gerekçeli susturmalar. Sunucudaki "False positive" işareti CI'da kalıcı
# olmadığı için yanlış alarmlar burada, gerekçesiyle tutulur (AGENTS.md).
sonar.issue.ignore.multicriteria=i18nPassword,scriptsPath,zapHttp,tailwindVariant,npmConfigCase
# Çeviri dosyalarında "parola" sözcüğünün çevirisi parola sanılıyor.
sonar.issue.ignore.multicriteria.i18nPassword.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.i18nPassword.resourceKey=packages/contracts/src/i18n/**
# Geliştirici betikleri docker/git/pnpm/node'u geliştiricinin PATH'iyle çağırır.
sonar.issue.ignore.multicriteria.scriptsPath.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.scriptsPath.resourceKey=scripts/**
# Yerel güvenlik taraması fikstürü http://localhost'ta çalışır.
sonar.issue.ignore.multicriteria.zapHttp.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.zapHttp.resourceKey=scripts/security-zap-fixture.mjs
# Tailwind v4 @custom-variant sözdizimi (& kök kural dışında) CSS ayrıştırıcısınca tanınmıyor.
sonar.issue.ignore.multicriteria.tailwindVariant.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.tailwindVariant.resourceKey=apps/web/app/globals.css
# npm_config_* küçük harfli biçimi npm'in kanonik adıdır (npm bunu alt
# süreçlerine böyle verir; bazı araçlar yalnızca bunu okur). Büyük harfe
# geçmek, ortamda aynı adın küçük harfli biçimi varsa hangisinin geçerli
# olacağını ortam sırasına bırakır; betik cache için de iki biçimi unset
# edip küçük harfi tek yetkili yapıyor. "ALL_CAPS olmalı" kuralı bu ad kalıbı
# için yanlış alarm (SonarCloud shelldre:S7684; yerel SonarQube'de yok).
sonar.issue.ignore.multicriteria.npmConfigCase.ruleKey=shelldre:S7684
sonar.issue.ignore.multicriteria.npmConfigCase.resourceKey=scripts/sites-env.sh

sonar.typescript.tsconfigPaths=tsconfig.json,apps/api/tsconfig.json,apps/web/tsconfig.json,apps/mobile/tsconfig.json
