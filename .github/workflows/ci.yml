name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck mobile
        run: pnpm mobile:typecheck
      - name: Lint
        run: pnpm lint
      - name: API tests
        run: pnpm test
      - name: Architecture tests
        run: pnpm test:architecture
      - name: Web build
        run: pnpm web:build
      - name: Web tests
        run: pnpm web:test
