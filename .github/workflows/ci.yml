name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck mobile
        run: pnpm mobile:typecheck
      - name: Lint
        run: pnpm lint
      - name: Mobile security tests
        run: pnpm mobile:security-test
      - name: API tests
        run: pnpm test
      - name: Media config tests
        run: node --test tests/media-config.test.mjs
      - name: Booking rules tests
        run: pnpm test:booking
      - name: Architecture tests
        run: pnpm test:architecture
      - name: Quality reporting tests
        run: pnpm test:quality
      - name: Web build
        run: pnpm web:build
      - name: Web tests
        run: pnpm web:test

  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PR'larında secret yok; o PR'larda iş çalışmaz (main'e push'ta çalışır).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=bburak2014
            -Dsonar.projectKey=bburak2014_derslik
            -Dsonar.scm.disabled=false
      - name: Sonar gate (zero open issues)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: pnpm quality:cloud
      - name: Upload Sonar findings
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-gate
          path: reports/sonar-gate.json
          if-no-files-found: ignore
