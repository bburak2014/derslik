name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck mobile
        run: pnpm mobile:typecheck
      - name: Lint
        run: pnpm lint
      - name: Mobile security tests
        run: pnpm mobile:security-test
      - name: API tests
        run: pnpm test
      - name: Media config tests
        run: node --test tests/media-config.test.mjs
      - name: Booking rules tests
        run: pnpm test:booking
      - name: Architecture tests
        run: pnpm test:architecture
      - name: Web build
        run: pnpm web:build
      - name: Web tests
        run: pnpm web:test
